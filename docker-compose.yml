version: "2.4"
# ⚠️ 服务器仍使用 docker-compose v1.29.2 + Docker 29：保持 v2.4 语法兼容。
# 该组合不要使用 down 或 --force-recreate；现有服务变更由 joytag-deploy 按单服务安全重建处理。
# 2026-08 EU 合规改造：端口全部改绑 127.0.0.1（除 Keycloak 8080，浏览器需直连——安全组限办公 IP）
services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: joytag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      # 无硬编码默认密钥：.env 必填（2026-08 起）
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY 必填（.env）}
    volumes:
      - ./qdrant_storage:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: joytag-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=joytag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填（.env）}
      # 供 init-keycloak-db.sh 建应用角色（不落 git）
      - JOYTAG_DB_PASSWORD=${JOYTAG_DB_PASSWORD:?JOYTAG_DB_PASSWORD 必填（.env）}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD 必填（.env）}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./keycloak/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: joytag-keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    ports:
      # 浏览器直连 Keycloak：不能绑 127.0.0.1，上线前必须用安全组将 8080 限制为办公 IP
      - "8080:8080"
    environment:
      # Keycloak 26 的引导变量仅用于首次创建或受控恢复管理员，不会自动修改已有账号密码。
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD 必填（.env）}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD 必填（.env）}
      # 过渡期 HTTP（无域名，Let's Encrypt 不签发裸 IP）；TLS 见 docs/EU_COMPLIANCE_PLAN.md P2
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      # 当前直接提供 HTTP 服务，无反向代理；接入代理时改用 KC_PROXY_HEADERS=xforwarded。
    volumes:
      # Mount the tracked export directly; a fresh clone must not depend on an untracked import directory.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joytag-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./.env
    environment:
      # 覆盖 .env 中的本地值，容器内互访走服务名
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://joytag:${JOYTAG_DB_PASSWORD:?JOYTAG_DB_PASSWORD 必填（.env）}@postgres:5432/joytag
      # Keycloak SSO：外部地址给浏览器/iss 校验，内部地址给 token 兑换/JWKS
      - AUTH_ENABLED=true
      - OIDC_ISSUER=${OIDC_ISSUER:-http://localhost:8080/realms/joytag}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:-http://keycloak:8080/realms/joytag/protocol/openid-connect/certs}
      - OIDC_TOKEN_URL=${OIDC_TOKEN_URL:-http://keycloak:8080/realms/joytag/protocol/openid-connect/token}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET 必填（.env，openssl rand -hex 32 生成）}
    volumes:
      - ./backend:/app
      - ./runtime-reports:/app/reports
      - huggingface_cache:/home/appuser/.cache/huggingface/hub
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  huggingface_cache:
